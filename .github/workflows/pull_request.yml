# This workflow will do a clean install of dependencies, build the source code and run tests

name: Linting, Testing and Auto-merge

# pull_request: lint/test jobs run on the PR head without repo secrets.
# pull_request_target: only the dependabot auto-merge job, which never checks
# out PR code, so untrusted code is never executed with secrets access.
on:
  pull_request:
  pull_request_target:

env:
  CI: true

jobs:
  lint_test_build:
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v3

      - name: Use Bun.sh
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache
        uses: actions/cache@v3
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('**/bun.lock') }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint code
        run: bun run lint

      - name: Build code
        run: bun run build

      - name: Test code
        run: bun run test
  auto-merge:
    if: github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]'
    timeout-minutes: 5

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: ahmadnassri/action-dependabot-auto-merge@v2
        with:
          target: minor
          approve: true
          github-token: ${{ secrets.GH_TOKEN }}
