# This workflow will do a clean install of dependencies, build the source code and run tests

name: Linting, Testing and Auto-merge

# runs on the PR head without repo secrets (dependabot auto-merge lives in
# automerge.yml, the only pull_request_target workflow, and it never checks
# out PR code)
on: pull_request

permissions:
  contents: read

env:
  CI: true

jobs:
  lint_test_build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Use Bun.sh
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2

      - name: Use Node.js 26 (node:test runtime)
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26

      - name: Cache
        uses: actions/cache@v6.1.0
        with:
          path: '~/.bun/install/cache'
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint code
        run: bun run lint

      - name: Build code
        run: bun run build

      - name: Test code
        run: bun run test
